[package]
name = "sigil"
version = "0.1.1"
description = "Capture and transplant PS5 extended storage partition headers"
authors = ["NSPX"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
thiserror = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true
